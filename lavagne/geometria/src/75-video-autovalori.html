<script>
(function(){ const { M } = Lav;
Lav.video('autovalori', 'video-autovalori', [
  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> Con <b>A = <span class=\"mx c2\"><span>2</span><span>1</span><span>1</span><span>2</span></span></b> calcola <b>A¹⁰·(1, 0)</b>.", "s": "Ecco un caso. Con la matrice due uno, uno due, calcola A alla decima per il vettore uno zero."}, {"m": "<b>Perché non ci riesci:</b> Sai solo fare il prodotto righe per colonne: dovresti moltiplicare dieci volte, con numeri che crescono a ogni passo. Lungo e pieno di occasioni di errore.", "s": "Sai solo il prodotto righe per colonne: dovresti moltiplicare dieci volte, con numeri sempre più grandi. Lungo e facile da sbagliare."}, {"m": "<b>Lo strumento:</b> Gli <b>autovettori</b>: vettori v con A·v = λ·v. Su di loro A fa solo \"moltiplica per λ\", quindi A¹⁰·v = λ¹⁰·v, senza prodotti di matrici.", "s": "Lo strumento sono gli autovettori: vettori con A per v uguale lambda per v. Su di loro A moltiplica solo per lambda, quindi A alla decima per v è lambda alla decima per v."}, {"m": "A·(1, 1) = (2 + 1, 1 + 2) = (3, 3) = 3·(1, 1)", "s": "A per uno uno: due più uno, uno più due, cioè tre tre, che è tre volte uno uno. Autovettore con lambda tre."}, {"m": "A·(1, −1) = (2 − 1, 1 − 2) = (1, −1) = 1·(1, −1)", "s": "A per uno meno uno: due meno uno, uno meno due, cioè uno meno uno. Autovettore con lambda uno."}, {"m": "(1, 0) = (1/2)·(1, 1) + (1/2)·(1, −1)", "s": "Scrivo uno zero con questi due: un mezzo per uno uno più un mezzo per uno meno uno fa un mezzo più un mezzo, un mezzo meno un mezzo, cioè uno zero."}, {"m": "A¹⁰·(1, 0) = (1/2)·3¹⁰·(1, 1) + (1/2)·1¹⁰·(1, −1)", "s": "Applico A dieci volte: il primo pezzo si moltiplica per tre alla dieci, il secondo per uno alla dieci, cioè resta com'è."}, {"m": "3¹⁰ = 59049 ⇒ = ((59049 + 1)/2, (59049 − 1)/2) = (29525, 29524)", "s": "Tre alla dieci fa cinquantanovemila quarantanove. Prima componente: più uno, diviso due, ventinovemila cinquecentoventicinque. Seconda: meno uno, diviso due, ventinovemila cinquecentoventiquattro."}, {"m": "Come trovarli: det(A − λ·I) = (2 − λ)² − 1 = 0 ⇒ 2 − λ = ±1 ⇒ λ = 1, λ = 3", "s": "Come si trovano i lambda senza indovinare: determinante di A meno lambda I uguale zero. Due meno lambda al quadrato meno uno uguale zero, quindi due meno lambda è più o meno uno: lambda uno e lambda tre."}, {"m": "<b>Formula:</b> A·v = λ·v, v ≠ 0. &nbsp; Autovalori: det(A − λ·I) = 0. &nbsp; Autospazio: V<sub>λ</sub> = ker(A − λ·I).<br>Diagonalizzabile ⇔ per ogni λ, mg(λ) = ma(λ).", "s": "La formula: A v uguale lambda v. Gli autovalori sono le soluzioni di determinante di A meno lambda I uguale zero, l'autospazio è il nucleo di A meno lambda I. A è diagonalizzabile se per ogni lambda molteplicità geometrica e algebrica coincidono."}, {"m": "<b>Casi che risolvi:</b><br>• Esercizio aperto: \"A è diagonalizzabile? Trova M e D\".<br>• Potenze grandi di una matrice.<br>• Quiz su autovalori con parametro.", "s": "Così risolvi: l'esercizio aperto sulla diagonalizzazione, le potenze grandi, e i quiz sugli autovalori."}]},
  { h:'1. Autovalori e autovettori', steps:[
    { m:'A·v = λ·v &nbsp; con v ≠ 0', s:'Un autovettore è un vettore v diverso da zero che, moltiplicato per A, resta sulla sua retta: A per v è lambda per v. Il numero lambda è l\'autovalore.' },
    { m:'A·v = λ·v ⇔ A·v − λ·I·v = 0 ⇔ (A − λ·I)·v = 0', s:'Porto tutto a sinistra: A per v meno lambda per v uguale zero. Scrivo lambda per v come lambda per I per v e raccolgo v: A meno lambda I, per v, uguale zero.' },
    { m:'Esiste v ≠ 0 ⇔ A − λ·I non invertibile ⇔ det(A − λ·I) = 0', s:'Questo sistema omogeneo ha una soluzione diversa da zero solo se la matrice A meno lambda I non è invertibile, cioè se il suo determinante è zero.' },
    { m:'Autovalori = radici di p<sub>A</sub>(λ) = det(A − λ·I)', s:'Quindi gli autovalori sono le radici del polinomio caratteristico.' },
    { m:'V<sub>λ</sub> = ker(A − λ·I), &nbsp; mg(λ) = dim V<sub>λ</sub> = n − rk(A − λ·I)', s:'Gli autovettori di lambda, insieme allo zero, formano l\'autospazio: il nucleo di A meno lambda I. La sua dimensione si chiama molteplicità geometrica, ed è n meno il rango di A meno lambda I.' }
  ]},
  { h:'2. Diagonalizzare A = '+M([[2,1],[1,2]]), steps:[
    { m:'p<sub>A</sub>(λ) = (2 − λ)(2 − λ) − 1·1 = 4 − 4λ + λ² − 1 = λ² − 4λ + 3', s:'Polinomio caratteristico: due meno lambda al quadrato meno uno per uno. Due meno lambda al quadrato fa quattro meno quattro lambda più lambda quadro. Tolgo uno: lambda quadro meno quattro lambda più tre.' },
    { m:'Δ = 16 − 12 = 4, √Δ = 2, λ = (4 ± 2)/2 ⇒ λ = 1, λ = 3', s:'Delta: sedici meno dodici fa quattro, radice due. Lambda è quattro più o meno due, diviso due: uno e tre.' },
    { m:'λ = 1: A − I = '+M([[1,1],[1,1]])+' ⇒ x + y = 0 ⇒ y = −x', s:'Per lambda uguale uno tolgo uno dalla diagonale: uno uno, uno uno. Il sistema dice x più y uguale zero, quindi y uguale meno x.' },
    { m:'(x, −x) = x·(1, −1) ⇒ V<sub>1</sub> = Span((1, −1))', s:'Il vettore è x, meno x, cioè x per uno meno uno. Autospazio di uno: Span di uno meno uno.' },
    { m:'λ = 3: A − 3I = '+M([[-1,1],[1,-1]])+' ⇒ −x + y = 0 ⇒ y = x', s:'Per lambda uguale tre tolgo tre: meno uno uno, uno meno uno. Il sistema dice meno x più y uguale zero, quindi y uguale x.' },
    { m:'(x, x) = x·(1, 1) ⇒ V<sub>3</sub> = Span((1, 1))', s:'Il vettore è x, x, cioè x per uno uno. Autospazio di tre: Span di uno uno.' },
    { m:'M = '+M([[1,1],[-1,1]])+', &nbsp; D = '+M([[1,0],[0,3]])+', &nbsp; M⁻¹·A·M = D', s:'M ha in colonna gli autovettori, D ha sulla diagonale gli autovalori nello stesso ordine: prima colonna con uno, seconda con tre.' },
    { m:'Verifica: A·(1, −1) = (2 − 1, 1 − 2) = (1, −1) = 1·(1, −1) ✓; &nbsp; A·(1, 1) = (3, 3) = 3·(1, 1) ✓', s:'Verifica: A per uno meno uno dà uno meno uno, cioè una volta se stesso. A per uno uno dà tre tre, cioè tre volte se stesso.' }
  ]},
  { h:'3. Il criterio: mg = ma', steps:[
    { m:'ma(λ) = quante volte λ è radice; &nbsp; 1 ≤ mg(λ) ≤ ma(λ)', s:'La molteplicità algebrica è quante volte lambda è radice del polinomio. La geometrica è sempre almeno uno e al massimo l\'algebrica.' },
    { m:'Diagonalizzabile ⇔ radici tutte in K e mg(λ) = ma(λ) per ogni λ', s:'A è diagonalizzabile se tutte le radici stanno nel campo e per ogni autovalore la geometrica è uguale all\'algebrica.' },
    { m:'Se ma = 1 ⇒ 1 ≤ mg ≤ 1 ⇒ mg = 1 automaticamente', s:'Se un autovalore ha molteplicità algebrica uno, la geometrica è schiacciata tra uno e uno, quindi è uno. Bisogna controllare solo gli autovalori con molteplicità due o più.' }
  ]},
  { h:'4. Guidato: A = '+M([[1,1,0],[0,1,0],[0,0,2]]), steps:[
    { m:'Triangolare ⇒ p<sub>A</sub>(λ) = (1 − λ)(1 − λ)(2 − λ)', s:'A è triangolare, quindi il polinomio è il prodotto della diagonale meno lambda: uno meno lambda, uno meno lambda, due meno lambda.' },
    { m:'λ = 1 con ma = 2; &nbsp; λ = 2 con ma = 1', s:'Uno compare due volte, quindi ha molteplicità algebrica due. Due compare una volta.' },
    { m:'A − 1·I: diagonale (1 − 1, 1 − 1, 2 − 1) = (0, 0, 1) ⇒ '+M([[0,1,0],[0,0,0],[0,0,1]]), s:'Controllo solo lambda uguale uno. Tolgo uno dalla diagonale: zero, zero, uno. Ecco A meno I.' },
    { m:'Righe non nulle (0, 1, 0), (0, 0, 1), indipendenti ⇒ rk = 2', s:'Ci sono due righe non nulle e indipendenti: il rango è due.' },
    { m:'mg(1) = 3 − 2 = 1 ≠ 2 = ma(1)', s:'Molteplicità geometrica: tre meno due, uno. Ma l\'algebrica è due. Sono diverse.' },
    { m:'⇒ A <b>non</b> è diagonalizzabile', s:'Quindi A non è diagonalizzabile: per l\'autovalore uno manca un autovettore.' }
  ]}
]); })();
</script>
