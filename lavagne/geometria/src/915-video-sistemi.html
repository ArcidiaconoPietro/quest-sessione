<script>
(function(){ const { M } = Lav;
Lav.video('sistemi', 'video-sistemi', [
  { h:'1. Rouché-Capelli', steps:[
    { m:'A·x = b, matrice completa (A | b)', s:'Un sistema lineare si scrive A per x uguale b. La matrice completa è A con b aggiunto come ultima colonna.' },
    { m:'Soluzioni ⇔ rk A = rk(A | b)', s:'Il teorema di Rouché-Capelli: il sistema ha soluzioni se e solo se il rango di A è uguale al rango della completa.' },
    { m:'Se sì: n − rk A parametri liberi', s:'Quando ha soluzioni, queste dipendono da n meno il rango parametri liberi, dove n è il numero di incognite.' },
    { m:'Riga (0, 0, 0 | 2) dopo Gauss ⇒ 0 = 2 ⇒ nessuna soluzione', s:'In pratica: se dopo Gauss trovi una riga di zeri con un numero diverso da zero a destra, quella riga dice zero uguale due, impossibile.' }
  ]},
  { h:'2. Sistema con parametro k', steps:[
    { m:'x + y + z = 1 <br>x + 2y + z = 2 <br>x + y + k·z = 3', s:'Discuto questo sistema al variare del numero k.' },
    { m:M([[1,1,1,'| 1'],[1,2,1,'| 2'],[1,1,'k','| 3']]), s:'Scrivo la matrice completa.' },
    { m:'R2 ← R2 − R1: (1 − 1, 2 − 1, 1 − 1 | 2 − 1) = (0, 1, 0 | 1)', s:'Alla riga due tolgo la riga uno: zero, uno, zero, e a destra due meno uno, uno.' },
    { m:'R3 ← R3 − R1: (1 − 1, 1 − 1, k − 1 | 3 − 1) = (0, 0, k − 1 | 2)', s:'Alla riga tre tolgo la riga uno: zero, zero, k meno uno, e a destra tre meno uno, due.' },
    { m:M([[1,1,1,'| 1'],[0,1,0,'| 1'],[0,0,'k − 1','| 2']]), s:'Ecco la matrice a scala. L\'ultimo pivot è k meno uno, che dipende da k.' },
    { m:'Prima di dividere per k − 1: è zero per k = 1 ⇒ caso a parte!', s:'Qui c\'è la trappola: vorrei dividere per k meno uno, ma per k uguale uno vale zero e non si può dividere. Quel caso si studia da solo.' }
  ]},
  { h:'3. Caso k = 1', steps:[
    { m:'k − 1 = 0 ⇒ terza riga (0, 0, 0 | 2): 0 = 2', s:'Con k uguale uno la terza riga diventa zero zero zero, e a destra due. Dice zero uguale due.' },
    { m:'rk A = 2, &nbsp; rk(A | b) = 3', s:'Il rango di A è due, perché ci sono due righe non nulle a sinistra. Il rango della completa è tre, perché c\'è anche il due.' },
    { m:'2 ≠ 3 ⇒ nessuna soluzione', s:'I ranghi sono diversi: per k uguale uno il sistema non ha soluzioni.' }
  ]},
  { h:'4. Caso k ≠ 1', steps:[
    { m:'rk A = rk(A | b) = 3 = n ⇒ una sola soluzione', s:'Con k diverso da uno, k meno uno non è zero, quindi ci sono tre pivot: i due ranghi sono tre, uguali al numero di incognite. Una sola soluzione.' },
    { m:'Riga 3: (k − 1)·z = 2 ⇒ z = 2/(k − 1)', s:'Dalla riga tre: k meno uno per z uguale due. Ora posso dividere: z uguale due fratto k meno uno.' },
    { m:'Riga 2: y = 1', s:'Dalla riga due: y uguale uno.' },
    { m:'Riga 1: x = 1 − y − z = 1 − 1 − 2/(k − 1) = −2/(k − 1)', s:'Dalla riga uno: x uguale uno meno y meno z. Uno meno uno fa zero, resta meno due fratto k meno uno.' },
    { m:'k = 3: z = 2/2 = 1, y = 1, x = −2/2 = −1', s:'Esempio con k uguale tre: z è due diviso due, uno. y è uno. x è meno due diviso due, meno uno.' },
    { m:'Verifica: −1 + 1 + 1 = 1 ✓; &nbsp; −1 + 2 + 1 = 2 ✓; &nbsp; −1 + 1 + 3·1 = 3 ✓', s:'Verifico nelle tre equazioni. Meno uno più uno più uno fa uno. Meno uno più due più uno fa due. Meno uno più uno più tre fa tre. Tutto giusto.' }
  ]}
]); })();
</script>
