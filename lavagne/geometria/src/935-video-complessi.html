  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> Risolvi <b>z² + 2z + 2 = 0</b>.", "s": "Ecco un caso. Risolvi z quadro più due z più due uguale zero."}, {"m": "<b>Perché non ci riesci:</b> Δ = 2² − 4·1·2 = 4 − 8 = −4 &lt; 0. Con i numeri reali ti fermi: nessun numero reale al quadrato fa −4, quindi \"nessuna soluzione\". Ma all'esame ti chiedono le soluzioni.", "s": "Delta è quattro meno otto, meno quattro. Nei reali ti fermi: nessun numero reale al quadrato dà un negativo. Ma all'esame le soluzioni le vogliono."}, {"m": "<b>Lo strumento:</b> I <b>numeri complessi</b>: si aggiunge un numero i con <b>i² = −1</b>. Così anche i negativi hanno radice quadrata e la formula del secondo grado funziona sempre.", "s": "Lo strumento sono i numeri complessi: si aggiunge un numero i con i quadro uguale meno uno. Così anche i negativi hanno radice, e la formula funziona sempre."}, {"m": "(2i)² = 2²·i² = 4·(−1) = −4 ⇒ radici di −4: ±2i", "s": "Due i al quadrato: quattro per i quadro, quattro per meno uno, meno quattro. Le radici di meno quattro sono più e meno due i."}, {"m": "z = (−2 ± 2i)/2 = −1 ± i", "s": "Formula: meno due più o meno due i, diviso due. Meno uno più i, e meno uno meno i."}, {"m": "Verifica z = −1 + i: z² = 1 − 2i + i² = 1 − 2i − 1 = −2i", "s": "Verifico. Meno uno più i al quadrato: uno meno due i più i quadro, cioè uno meno due i meno uno, meno due i."}, {"m": "z² + 2z + 2 = −2i + (−2 + 2i) + 2 = 0 ✓", "s": "Più due z, che è meno due più due i, più due: le i si cancellano, i numeri pure. Zero."}, {"m": "<b>Formula:</b> i² = −1. &nbsp; az² + bz + c = 0 ⇒ z = (−b ± w)/(2a), con w² = Δ.", "s": "La formula: i quadro uguale meno uno. Le soluzioni sono meno b più o meno w, diviso due a, dove w è un numero con w al quadrato uguale delta."}, {"m": "<b>Casi che risolvi:</b><br>• Equazioni di secondo grado con Δ &lt; 0 o con coefficienti complessi.<br>• Prodotti e inversi (sempre con i² = −1).<br>• Potenze grandi: lì serve De Moivre (scena 4).", "s": "Così risolvi: le equazioni di secondo grado con delta negativo, prodotti e inversi, e con De Moivre le potenze grandi."}]},
  { h:'1. Il prodotto, con tutti e 4 i pezzi', steps:[

    { m:'= 3 + 2 + (−3 + 2)·i = 5 − i', s:'Raccolgo: parte reale tre più due, cinque. Parte immaginaria meno tre più due, meno uno. Risultato cinque meno i.' }

    { m:'Verifica: (2 − i)(2 + i) = 4 + 2i − 2i − i² = 4 − (−1) = 5 ⇒ 5/5 = 1 ✓', s:'Verifica: due meno i per due più i fa quattro più due i meno due i meno i quadro. Le i si cancellano, meno i quadro fa più uno, totale cinque. Diviso cinque fa uno.' }

    { m:'Radici quadrate di −4: (2i)² = 4i² = −4 ⇒ ±2i', s:'In C delta negativo va bene. Le radici quadrate di meno quattro sono due i e meno due i, perché due i al quadrato fa quattro i quadro, meno quattro.' },
