<script>
(function(){ const { M } = Lav;
Lav.video('determinante', 'video-determinante', [
  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> Per quali k la matrice <b>A = <span class=\"mx c3\"><span>1</span><span>2</span><span>0</span><span>0</span><span>1</span><span>k</span><span>1</span><span>0</span><span>1</span></span></b> è invertibile?", "s": "Ecco un caso. Per quali valori di k la matrice uno due zero, zero uno k, uno zero uno è invertibile?"}, {"m": "<b>Perché non ci riesci:</b> Con Gauss dovresti portare avanti k in ogni passaggio e, prima di dividere per un'espressione con k, studiare a parte il caso in cui vale 0. È la trappola dei sistemi con parametro: facile sbagliare.", "s": "Con Gauss dovresti portare k in ogni passaggio, e prima di dividere per un'espressione con k studiare a parte quando vale zero. È la trappola dei parametri."}, {"m": "<b>Lo strumento:</b> Il <b>determinante</b>: un solo numero calcolato con una formula, senza divisioni. A è invertibile esattamente quando det A ≠ 0.", "s": "Lo strumento è il determinante: un solo numero, calcolato con una formula senza divisioni. A è invertibile esattamente quando il determinante non è zero."}, {"m": "det A = 1·det<span class=\"mx c2\"><span>1</span><span>k</span><span>0</span><span>1</span></span> − 2·det<span class=\"mx c2\"><span>0</span><span>k</span><span>1</span><span>1</span></span> + 0·(…)", "s": "Sviluppo lungo la prima riga: uno per il determinante che resta togliendo riga uno e colonna uno, meno due per quello che resta togliendo riga uno e colonna due, più zero per il terzo."}, {"m": "det<span class=\"mx c2\"><span>1</span><span>k</span><span>0</span><span>1</span></span> = 1·1 − k·0 = 1", "s": "Il primo due per due: uno per uno meno k per zero, uno."}, {"m": "det<span class=\"mx c2\"><span>0</span><span>k</span><span>1</span><span>1</span></span> = 0·1 − k·1 = −k", "s": "Il secondo: zero per uno meno k per uno, meno k."}, {"m": "det A = 1·1 − 2·(−k) = 1 + 2k", "s": "Metto insieme: uno per uno meno due per meno k, cioè uno più due k."}, {"m": "1 + 2k = 0 ⇔ k = −1/2 ⇒ invertibile per k ≠ −1/2", "s": "Il determinante è zero solo per k uguale meno un mezzo. Quindi A è invertibile per ogni k diverso da meno un mezzo."}, {"m": "Controllo k = −1/2: R3 − R1 = (0, −2, 1); + 2·R2 = (0, −2 + 2, 1 − 1) = (0, 0, 0)", "s": "Controllo con Gauss per k meno un mezzo: riga tre meno riga uno fa zero meno due uno, più due volte la riga due fa zero. Rango due: non invertibile, come previsto."}, {"m": "<b>Formula:</b> 2 × 2: det<span class=\"mx c2\"><span>a</span><span>b</span><span>c</span><span>d</span></span> = a·d − b·c. &nbsp; 3 × 3: sviluppo lungo una riga con i segni + − +.<br>det A ≠ 0 ⇔ A invertibile ⇔ rk A = n.", "s": "La formula: per un due per due, a per d meno b per c. Per un tre per tre, sviluppo lungo una riga con i segni più meno più. Il determinante è diverso da zero se e solo se A è invertibile."}, {"m": "<b>Casi che risolvi:</b><br>• Invertibilità o rango con un parametro k.<br>• \"Questi n vettori di Kⁿ sono una base?\": det della matrice ≠ 0.<br>• Dal capitolo 6: gli autovalori, con det(A − λ·I) = 0.", "s": "Così risolvi: invertibilità o rango con parametro, se n vettori sono una base, e dal capitolo sei gli autovalori."}]},
  { h:'1. Determinante 2 × 2', steps:[
    { m:'det '+M([['a','b'],['c','d']])+' = a·d − b·c', s:'Il determinante di una due per due è a per d meno b per c: diagonale principale meno l\'altra diagonale.' },
    { m:'det '+M([[3,1],[4,2]])+' = 3·2 − 1·4 = 6 − 4 = 2', s:'Esempio: tre per due fa sei, uno per quattro fa quattro, sei meno quattro fa due.' },
    { m:'|det A| = area del parallelogramma costruito sulle colonne', s:'Il valore assoluto del determinante è l\'area del parallelogramma che ha le colonne come lati. Se è zero, le colonne stanno sulla stessa retta.' }
  ]},
  { h:'2. Laplace su A = '+M([[2,0,1],[1,3,2],[1,1,2]]), steps:[
    { m:'Sviluppo lungo la riga 1, segni + − +', s:'Per una tre per tre uso Laplace lungo la prima riga. I segni seguono la scacchiera: più, meno, più.' },
    { m:'a₁₁ = 2: tolgo riga 1 e colonna 1 → det '+M([[3,2],[1,2]])+' = 3·2 − 2·1 = 6 − 2 = 4', s:'Primo termine: a uno uno vale due. Tolgo riga uno e colonna uno, resta tre due, uno due. Il suo determinante è tre per due meno due per uno: sei meno due, quattro.' },
    { m:'Contributo: +2·4 = 8', s:'Contributo del primo termine: più due per quattro, otto.' },
    { m:'a₁₂ = 0 ⇒ contributo −0·(…) = 0', s:'Secondo termine: a uno due è zero, quindi contribuisce zero e non serve calcolare il minore.' },
    { m:'a₁₃ = 1: tolgo riga 1 e colonna 3 → det '+M([[1,3],[1,1]])+' = 1·1 − 3·1 = 1 − 3 = −2', s:'Terzo termine: a uno tre vale uno. Tolgo riga uno e colonna tre, resta uno tre, uno uno. Determinante: uno per uno meno tre per uno, cioè uno meno tre, meno due.' },
    { m:'Contributo: +1·(−2) = −2', s:'Contributo: più uno per meno due, meno due.' },
    { m:'det A = 8 + 0 − 2 = 6', s:'Sommo: otto più zero meno due fa sei.' }
  ]},
  { h:'3. Lo stesso determinante con Gauss', steps:[
    { m:'Regole: scambio ⇒ segno cambia; aggiungo un multiplo ⇒ non cambia; triangolare ⇒ prodotto della diagonale', s:'Con Gauss uso tre regole. Uno scambio di righe cambia il segno. Aggiungere a una riga un multiplo di un\'altra non cambia niente. Una matrice triangolare ha come determinante il prodotto della diagonale.' },
    { m:'Scambio R1 ↔ R2: '+M([[1,3,2],[2,0,1],[1,1,2]])+' &nbsp; (segno −)', s:'Per avere un uno come pivot scambio la riga uno e la riga due. Mi segno che il determinante ha cambiato segno.' },
    { m:'R2 ← R2 − 2·R1: (2 − 2, 0 − 6, 1 − 4) = (0, −6, −3)', s:'Alla riga due tolgo due volte la riga uno: due meno due zero, zero meno sei meno sei, uno meno quattro meno tre.' },
    { m:'R3 ← R3 − R1: (1 − 1, 1 − 3, 2 − 2) = (0, −2, 0)', s:'Alla riga tre tolgo la riga uno: zero, meno due, zero.' },
    { m:'R3 ← R3 − (1/3)·R2: (0, −2 − (1/3)·(−6), 0 − (1/3)·(−3)) = (0, −2 + 2, 0 + 1) = (0, 0, 1)', s:'Alla riga tre tolgo un terzo della riga due. Meno due meno un terzo per meno sei fa meno due più due, zero. Zero meno un terzo per meno tre fa più uno.' },
    { m:M([[1,3,2],[0,-6,-3],[0,0,1]])+' &nbsp; prodotto della diagonale = 1·(−6)·1 = −6', s:'Matrice triangolare: il prodotto della diagonale è uno per meno sei per uno, meno sei.' },
    { m:'1 scambio ⇒ det A = −(−6) = 6 ✓', s:'C\'è stato uno scambio, quindi cambio segno: meno meno sei fa sei. Uguale a Laplace.' }
  ]},
  { h:'4. Le proprietà con i numeri', steps:[
    { m:'Binet: det(A·B) = det A · det B; &nbsp; det A = 2, det B = 5 ⇒ det(A·B) = 10', s:'Binet: il determinante di un prodotto è il prodotto dei determinanti. Con due e cinque viene dieci.' },
    { m:'det(λ·A) = λⁿ·det A: n = 3, λ = 3, det A = 2 ⇒ 3·3·3·2 = 27·2 = 54', s:'Attenzione: tre per A moltiplica per tre ognuna delle tre righe, quindi il determinante si moltiplica per tre tre volte. Tre alla terza fa ventisette, per due fa cinquantaquattro. Non sei.' },
    { m:'det(A⁻¹) = 1/det A: da det A · det A⁻¹ = det I = 1', s:'Il determinante dell\'inversa è uno diviso il determinante di A, perché per Binet il loro prodotto è il determinante dell\'identità, che è uno.' },
    { m:'A invertibile ⇔ det A ≠ 0', s:'E la regola più usata: A è invertibile se e solo se il determinante non è zero. Il segno non conta.' }
  ]}
]); })();
</script>
