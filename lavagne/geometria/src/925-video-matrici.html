  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> Devi risolvere <b>3x + y = b₁, 4x + 2y = b₂</b> per tanti termini noti: (5, 6), (1, 0), (0, 1)… Devi rifare Gauss ogni volta?", "s": "Ecco un caso. Devi risolvere tre x più y uguale b uno, quattro x più due y uguale b due, per tanti termini noti diversi. Devi rifare Gauss ogni volta?"}, {"m": "<b>Perché non ci riesci:</b> Con Gauss sì: ogni nuovo b è un nuovo sistema da risolvere da capo.", "s": "Con Gauss sì: ogni nuovo b è un sistema nuovo da rifare da capo."}, {"m": "<b>Lo strumento:</b> L'<b>inversa</b> A⁻¹: la calcoli una volta, poi x = A⁻¹·b per ogni b, con un solo prodotto.", "s": "Lo strumento è l'inversa: la calcoli una volta, poi x uguale A inversa per b, per ogni b."}, {"m": "A = <span class=\"mx c2\"><span>3</span><span>1</span><span>4</span><span>2</span></span>, det A = 3·2 − 1·4 = 2", "s": "La matrice dei coefficienti è tre uno, quattro due. Determinante: sei meno quattro, due."}, {"m": "A⁻¹ = (1/2)·<span class=\"mx c2\"><span>2</span><span>−1</span><span>−4</span><span>3</span></span> = <span class=\"mx c2\"><span>1</span><span>−1/2</span><span>−2</span><span>3/2</span></span>", "s": "Scambio la diagonale, cambio segno agli altri, divido per due: uno, meno un mezzo, meno due, tre mezzi."}, {"m": "b = (5, 6): x = 1·5 + (−1/2)·6 = 5 − 3 = 2, &nbsp; y = −2·5 + (3/2)·6 = −10 + 9 = −1", "s": "Per cinque sei: x è uno per cinque più meno un mezzo per sei, cinque meno tre, due. y è meno due per cinque più tre mezzi per sei, meno dieci più nove, meno uno."}, {"m": "Verifica: 3·2 + (−1) = 5 ✓, &nbsp; 4·2 + 2·(−1) = 6 ✓", "s": "Verifico: sei meno uno fa cinque, otto meno due fa sei."}, {"m": "b = (1, 0): x = 1, y = −2 → 3 − 2 = 1 ✓, 4 − 4 = 0 ✓", "s": "Per uno zero leggo la prima colonna dell'inversa: x uno, y meno due. Tre meno due fa uno, quattro meno quattro fa zero. Nessun Gauss."}, {"m": "<b>Formula:</b> A⁻¹ = (1/det A)·<span class=\"mx c2\"><span>d</span><span>−b</span><span>−c</span><span>a</span></span> per A = <span class=\"mx c2\"><span>a</span><span>b</span><span>c</span><span>d</span></span>, det A ≠ 0. &nbsp; A·x = b ⇒ x = A⁻¹·b.", "s": "La formula: l'inversa di a b c d è uno fratto determinante per d, meno b, meno c, a. E la soluzione di A x uguale b è A inversa per b."}, {"m": "<b>Casi che risolvi:</b><br>• Inversa 2 × 2 nel quiz.<br>• Inversa 3 × 3 con Gauss-Jordan.<br>• Sistemi n × n con det ≠ 0.", "s": "Così risolvi: l'inversa due per due del quiz, l'inversa tre per tre con Gauss-Jordan, e i sistemi quadrati con determinante diverso da zero."}]},
