<script>
(function(){ const { M } = Lav;
Lav.video('caratteristico', 'video-caratteristico', [
  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> La stessa f: R² → R² ha matrice <b>A = <span class=\"mx c2\"><span>2</span><span>1</span><span>1</span><span>2</span></span></b> in base canonica, e un compagno, con la base b₁ = (1, 1), b₂ = (1, −1), trova <b>B = <span class=\"mx c2\"><span>3</span><span>0</span><span>0</span><span>1</span></span></b>. Sono davvero la stessa funzione?", "s": "Ecco un caso. La stessa funzione ha matrice due uno, uno due in base canonica, e un compagno con un'altra base trova tre zero, zero uno. Sono davvero la stessa funzione?"}, {"m": "<b>Perché non ci riesci:</b> Sai costruire la matrice di f in una base, ma non sai <b>confrontare</b> due matrici della stessa f: hanno numeri diversi, e non hai una regola per passare dall'una all'altra.", "s": "Sai costruire la matrice in una base, ma non sai confrontare due matrici della stessa funzione: hanno numeri diversi."}, {"m": "<b>Lo strumento:</b> Il <b>cambio di base</b> B = M⁻¹·A·M, con M che ha in colonna la nuova base, e i numeri che <b>non cambiano</b> con la base: traccia, determinante, polinomio caratteristico.", "s": "Lo strumento è il cambio di base: B uguale M inversa per A per M, con M che ha in colonna la nuova base. E ci sono numeri che non cambiano: traccia, determinante e polinomio caratteristico."}, {"m": "tr A = 2 + 2 = 4, &nbsp; tr B = 3 + 1 = 4 ✓", "s": "Traccia, cioè somma della diagonale: due più due fa quattro, tre più uno fa quattro. Uguali."}, {"m": "det A = 2·2 − 1·1 = 3, &nbsp; det B = 3·1 − 0·0 = 3 ✓", "s": "Determinante: quattro meno uno, tre; tre meno zero, tre. Uguali."}, {"m": "M = <span class=\"mx c2\"><span>1</span><span>1</span><span>1</span><span>−1</span></span> (colonne b₁, b₂)", "s": "Per esserne sicuro scrivo M con in colonna b uno e b due."}, {"m": "A·b₁ = (2 + 1, 1 + 2) = (3, 3), &nbsp; A·b₂ = (2 − 1, 1 − 2) = (1, −1) ⇒ A·M = <span class=\"mx c2\"><span>3</span><span>1</span><span>3</span><span>−1</span></span>", "s": "A per b uno: due più uno, uno più due, cioè tre tre. A per b due: due meno uno, uno meno due, cioè uno meno uno. A per M ha queste colonne."}, {"m": "M·B = <span class=\"mx c2\"><span>1·3 + 1·0</span><span>1·0 + 1·1</span><span>1·3 + (−1)·0</span><span>1·0 + (−1)·1</span></span> = <span class=\"mx c2\"><span>3</span><span>1</span><span>3</span><span>−1</span></span> = A·M ✓", "s": "M per B: righe di M per colonne di B. Viene tre uno, tre meno uno, uguale ad A per M."}, {"m": "A·M = M·B ⇒ B = M⁻¹·A·M ⇒ stessa funzione", "s": "A per M uguale M per B, quindi B è M inversa per A per M: è la stessa funzione vista in un'altra base. Senza calcolare l'inversa."}, {"m": "<b>Formula:</b> B = M⁻¹·A·M (colonne di M = nuova base). &nbsp; p<sub>A</sub>(λ) = det(A − λ·I); per 2 × 2: p<sub>A</sub>(λ) = λ² − tr A·λ + det A.<br>Simili ⇒ stessi tr, det, rk, p<sub>A</sub>.", "s": "La formula: B uguale M inversa A M. Il polinomio caratteristico è il determinante di A meno lambda I; per un due per due, lambda quadro meno traccia per lambda più determinante. Matrici simili hanno stessa traccia, determinante, rango e polinomio."}, {"m": "<b>Casi che risolvi:</b><br>• Quiz \"A e B sono simili?\": se tr o det sono diversi, sicuramente no.<br>• Matrice di f in un'altra base.<br>• Polinomio caratteristico, che serve nel capitolo 7.", "s": "Così risolvi: se due matrici sono simili, la matrice in un'altra base, e il polinomio caratteristico."}]},
  { h:'1. Matrice di cambiamento di base', steps:[
    { m:'[id]<sup>B</sup><sub>C</sub>: colonna j = coordinate di v<sub>j</sub> rispetto a C', s:'La matrice di cambiamento di base da B a C ha nella colonna j le coordinate del j-esimo vettore di B scritte nella base C.' },
    { m:'B = ((1, 2), (0, 1)), C = canonica ⇒ M = '+M([[1,0],[2,1]]), s:'Se C è la base canonica, le colonne sono proprio i vettori di B: uno due, e zero uno.' },
    { m:'[v]<sub>B</sub> = (1, 1) ⇒ [v]<sub>C</sub> = M·(1, 1) = (1·1 + 0·1, 2·1 + 1·1) = (1, 3)', s:'Se un vettore ha coordinate uno uno in B, nella base canonica è M per uno uno: uno per uno più zero per uno fa uno; due per uno più uno per uno fa tre. Quindi uno tre.' },
    { m:'Verifica: 1·(1, 2) + 1·(0, 1) = (1, 3) ✓', s:'Verifica diretta: una volta uno due più una volta zero uno fa uno tre.' }
  ]},
  { h:'2. Un endomorfismo in un\'altra base', steps:[
    { m:'A = '+M([[2,1],[1,2]])+', nuova base B = ((1, 1), (1, −1))', s:'Prendo A due uno, uno due, e la nuova base uno uno e uno meno uno.' },
    { m:'A·(1, 1) = (2·1 + 1·1, 1·1 + 2·1) = (3, 3)', s:'Calcolo A sul primo vettore: due per uno più uno per uno fa tre, uno per uno più due per uno fa tre. Risultato tre tre.' },
    { m:'(3, 3) = 3·(1, 1) + 0·(1, −1) → coordinate (3, 0)', s:'Tre tre è tre volte uno uno più zero volte uno meno uno. Coordinate tre zero.' },
    { m:'A·(1, −1) = (2·1 + 1·(−1), 1·1 + 2·(−1)) = (2 − 1, 1 − 2) = (1, −1)', s:'Sul secondo vettore: due meno uno fa uno, uno meno due fa meno uno. Risultato uno meno uno.' },
    { m:'(1, −1) = 0·(1, 1) + 1·(1, −1) → coordinate (0, 1)', s:'È zero volte il primo più una volta il secondo: coordinate zero uno.' },
    { m:'[f]<sup>B</sup><sub>B</sub> = '+M([[3,0],[0,1]])+' &nbsp; diagonale!', s:'Metto le coordinate in colonna: tre zero, zero uno. È diagonale. Nella base B la funzione allunga il primo vettore di tre e lascia fermo il secondo.' },
    { m:'Controllo invarianti: tr A = 2 + 2 = 4 = 3 + 1; &nbsp; det A = 4 − 1 = 3 = 3·1 ✓', s:'Controllo: la traccia di A è quattro, come tre più uno. Il determinante di A è quattro meno uno, tre, come tre per uno. Matrici simili hanno stessa traccia e stesso determinante.' }
  ]},
  { h:'3. Polinomio caratteristico di A = '+M([[4,1],[2,3]]), steps:[
    { m:'p<sub>A</sub>(λ) = det(A − λ·I) = det '+M([['4 − λ',1],[2,'3 − λ']]), s:'Il polinomio caratteristico è il determinante di A meno lambda per l\'identità: tolgo lambda dalla diagonale.' },
    { m:'= (4 − λ)·(3 − λ) − 1·2', s:'Determinante due per due: quattro meno lambda per tre meno lambda, meno uno per due.' },
    { m:'(4 − λ)(3 − λ) = 12 − 4λ − 3λ + λ² = λ² − 7λ + 12', s:'Sviluppo il prodotto: quattro per tre fa dodici, quattro per meno lambda fa meno quattro lambda, meno lambda per tre fa meno tre lambda, meno lambda per meno lambda fa lambda quadro.' },
    { m:'p<sub>A</sub>(λ) = λ² − 7λ + 12 − 2 = λ² − 7λ + 10', s:'Tolgo il due: lambda quadro meno sette lambda più dieci.' },
    { m:'Scorciatoia 2 × 2: λ² − (tr A)·λ + det A; &nbsp; tr A = 7, det A = 12 − 2 = 10 ✓', s:'Per le due per due c\'è la scorciatoia: lambda quadro meno traccia per lambda più determinante. La traccia è sette e il determinante è dieci: torna.' },
    { m:'Δ = 49 − 40 = 9, √Δ = 3, &nbsp; λ = (7 ± 3)/2', s:'Radici: delta è quarantanove meno quaranta, nove. Radice di nove è tre. Lambda è sette più o meno tre, diviso due.' },
    { m:'λ₁ = 4/2 = 2, &nbsp; λ₂ = 10/2 = 5', s:'Sette meno tre fa quattro, diviso due fa due. Sette più tre fa dieci, diviso due fa cinque.' }
  ]},
  { h:'4. Triangolari e trappola', steps:[
    { m:'A triangolare ⇒ p<sub>A</sub>(λ) = (a₁₁ − λ)·(a₂₂ − λ)·…', s:'Se A è triangolare, anche A meno lambda I è triangolare, e il suo determinante è il prodotto della diagonale. Le radici sono i numeri sulla diagonale.' },
    { m:M([[1,4,5],[0,2,6],[0,0,2]])+' ⇒ (1 − λ)(2 − λ)(2 − λ): radici 1, 2, 2', s:'Esempio: diagonale uno, due, due. Le radici sono uno e due, con due che compare due volte.' },
    { m:'Simili ⇒ stessi tr, det, p<sub>A</sub>. &nbsp; Il contrario NO: '+M([[1,1],[0,1]])+' e I', s:'Attenzione: matrici simili hanno gli stessi invarianti, ma il contrario è falso. Uno uno, zero uno e l\'identità hanno stessa traccia, due, e stesso determinante, uno, ma non sono simili.' },
    { m:'M⁻¹·I·M = M⁻¹·M = I per ogni M', s:'Il motivo: qualsiasi cambio di base applicato all\'identità dà ancora l\'identità. Quindi l\'unica matrice simile all\'identità è l\'identità stessa.' }
  ]}
]); })();
</script>
