  {"h": "0. Il problema che non sai ancora risolvere", "steps": [{"m": "<b>Il caso:</b> I tre vettori <b>(1, 2, 3), (2, 4, 7), (3, 6, 10)</b> sono una base di R³? E quanti di loro servono davvero?", "s": "Ecco un caso. I vettori uno due tre, due quattro sette e tre sei dieci sono una base di R tre? E quanti di loro servono davvero?"}, {"m": "<b>Perché non ci riesci:</b> Con il capitolo 1 dovresti scrivere a·v₁ + b·v₂ + c·v₃ = 0 e risolvere un sistema 3 × 3 ogni volta. Con 5 vettori di R⁴ diventa lunghissimo, e comunque non ti dice <b>quanti</b> vettori sono utili.", "s": "Col capitolo uno dovresti scrivere a per v uno più b per v due più c per v tre uguale zero e risolvere un sistema tre per tre, ogni volta. Con più vettori diventa lunghissimo, e comunque non ti dice quanti sono utili."}, {"m": "<b>Lo strumento:</b> Il <b>rango</b>: metti i vettori come righe di una matrice, fai Gauss e conti i <b>pivot</b>. Il numero di pivot è il numero di vettori indipendenti.", "s": "Lo strumento è il rango. Metto i vettori come righe di una matrice, faccio Gauss e conto i pivot. Il numero di pivot è il numero di vettori indipendenti."}, {"m": "<span class=\"mx c3\"><span>1</span><span>2</span><span>3</span><span>2</span><span>4</span><span>7</span><span>3</span><span>6</span><span>10</span></span>", "s": "Metto i tre vettori come righe."}, {"m": "R2 ← R2 − 2·R1: (2 − 2, 4 − 4, 7 − 6) = (0, 0, 1)", "s": "Alla riga due tolgo due volte la riga uno: due meno due, quattro meno quattro, sette meno sei. Viene zero zero uno."}, {"m": "R3 ← R3 − 3·R1: (3 − 3, 6 − 6, 10 − 9) = (0, 0, 1)", "s": "Alla riga tre tolgo tre volte la riga uno: tre meno tre, sei meno sei, dieci meno nove. Viene zero zero uno."}, {"m": "R3 ← R3 − R2: (0, 0, 1 − 1) = (0, 0, 0)", "s": "Alla riga tre tolgo la nuova riga due: viene tutta zero."}, {"m": "2 pivot ⇒ rk = 2 &lt; 3 ⇒ non è una base", "s": "Restano due righe non nulle, cioè due pivot. Il rango è due, meno di tre: non è una base di R tre."}, {"m": "Infatti   { h:'4. Dallo Span all\'equazione cartesiana', steps:[
